[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyMagicStat"
version = "0.2.0.dev0"
description = "Applied statistics with explicit inference diagnostics and method selection"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Ehud Bottaro", email = "ehud.bottaro@me.com" },
]
dependencies = [
  "matplotlib>=3.7",
  "numba>=0.58",
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.11",
  "seaborn>=0.13",
  "statsmodels>=0.14",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
]

[tool.setuptools.packages.find]
include = ["pyMagicStat*"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
